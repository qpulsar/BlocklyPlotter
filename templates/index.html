{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="row">
    <div class="col-md-6 p-0">
        <div id="blocklyArea">
            <div id="blocklyDiv"></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card mt-3">
            <div class="card-header d-flex justify-content-between align-items-center">
                <span>Çıktı</span>
                <div>
                    <button id="runButton" class="btn btn-success btn-sm">
                        <i class="fas fa-play"></i> Çalıştır
                    </button>
                    <button id="clearButton" class="btn btn-danger btn-sm">
                        <i class="fas fa-trash"></i> Temizle
                    </button>
                </div>
            </div>
            <div class="card-body text-center">
                <canvas id="outputCanvas" width="600" height="600" class="border"></canvas>
            </div>
        </div>
    </div>
</div>

{% include 'partials/toolbox.html' %}
{% endblock %}

{% block scripts %}
<!-- Block definitions and generators -->
<script src="{% static 'js/blocks/control-blocks.js' %}"></script>
<script src="{% static 'js/blocks/event-blocks.js' %}"></script>
<script src="{% static 'js/blocks/math-logic-blocks.js' %}"></script>
<script src="{% static 'js/blocks/movement-blocks.js' %}"></script>
<script src="{% static 'js/blocks/time-blocks.js' %}"></script>
<script src="{% static 'js/blocks/data-blocks.js' %}"></script>
<script src="{% static 'js/blocks/shape-blocks.js' %}"></script>
<script src="{% static 'js/blocks/pen-settings-blocks.js' %}"></script>
<script src="{% static 'js/blocks/advanced-math-blocks.js' %}"></script>
<script src="{% static 'js/blocks/physics-blocks.js' %}"></script>

<!-- JavaScript generators -->
<script src="{% static 'js/block-generators.js' %}"></script>

<!-- Main application scripts -->
<script src="{% static 'js/blockly-config.js' %}"></script>
<script src="{% static 'js/canvas-operations.js' %}"></script>
<script src="{% static 'js/canvas/shape-drawing-operations.js' %}"></script>
<script src="{% static 'js/canvas/physics-drawing-operations.js' %}"></script>
<script src="{% static 'js/variable-watcher.js' %}"></script>
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
